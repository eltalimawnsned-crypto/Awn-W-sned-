name: نشر المنصة على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: ختم رقم الإصدار (لإجبار المتصفحات على تحميل الملفات الجديدة)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$V/g" index.html admin/index.html
          grep -c "$V" index.html admin/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
