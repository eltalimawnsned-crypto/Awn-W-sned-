<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>منصة المحجة البيضاء التعليمية</title>
  <style>
    :root { --navy: #2c2853; --deep: #1c1938; --rose: #e4b0b5; --paper: #f7f5fa; --ink: #221f40; --muted: #6a6585; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: "Tajawal", system-ui, sans-serif; background: linear-gradient(160deg, var(--navy), var(--deep)); color: #fff; text-align: center; }
    .card { max-width: 420px; width: 100%; background: var(--paper); color: var(--ink); border-radius: 16px; padding: 28px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.8; margin: 0 0 18px; }
    a { display: block; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 700; margin-top: 8px; }
    .main { background: var(--navy); color: #fff; }
    .alt { border: 1px solid var(--navy); color: var(--navy); }
  </style>
  <script>
    /* رابط غير موجود داخل الموقع (مثل فاصلة أو حرف زائد في آخره):
       نوجّه الزائر تلقائيًا إلى الصفحة الصحيحة بدل صفحة الخطأ. */
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var base = "/" + (parts.length ? parts[0] + "/" : "");
      var wantsAdmin = /admin/i.test(location.pathname);
      var target = base + (wantsAdmin ? "admin/" : "") + (location.hash || "");
      window.__target = target;
      if (location.pathname !== target) location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>جارٍ نقلك إلى منصة المحجة البيضاء…</h1>
    <p>الرابط الذي فتحته غير صحيح، وسننقلك تلقائيًا. إن لم يحدث ذلك فاختر:</p>
    <a class="main" id="goHome" href="./">الصفحة الرئيسية</a>
    <a class="alt" id="goAdmin" href="./admin/">لوحة الإدارة</a>
  </div>
  <script>
    var parts = location.pathname.split("/").filter(Boolean);
    var base = "/" + (parts.length ? parts[0] + "/" : "");
    document.getElementById("goHome").href = base;
    document.getElementById("goAdmin").href = base + "admin/";
  </script>
</body>
</html>
